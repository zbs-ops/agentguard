[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentguard-eval"
version = "0.3.0"
description = "Guardrails and evals for AI agents: a policy gate for tool calls, a checker for invented facts, and a benchmark for shell-command gates. Deterministic, no API keys."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zohaib Qamar" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["ai-safety", "llm", "agents", "guardrails", "evaluation", "hallucination", "pytest"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Framework :: Pytest",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/zbs-ops/agentguard"
Source = "https://github.com/zbs-ops/agentguard"
Issues = "https://github.com/zbs-ops/agentguard/issues"

[project.scripts]
agentguard = "agentguard.cli:main"

[project.entry-points.pytest11]
agentguard = "agentguard.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/agentguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# The checker deliberately handles non-ASCII quotes (guillemets, curly quotes) in its patterns
# and test data, so the ambiguous-character warnings are expected.
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.per-file-ignores]
# Test data (transcripts, parametrized attack strings) is naturally wide; keep it readable.

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/agentguard"]
