name: Publish to PyPI

# Fires when a GitHub release is published. Uses PyPI Trusted Publishing (OIDC), so there is
# no token to store: the project's publisher on PyPI is linked to this repo and workflow.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
